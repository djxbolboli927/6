market = "8FnX3xo2yYw3EUE6w3nQA4GfXGS9wpK6oj3veJpbFzLo"
base_ta = "ATRsNGv2nDw7hSMfkUTBoVUDsFDwN7po7KbecyiGWNB4"   # WSOL vault
quote_ta = "2Y7HATmn9aJBcxCskE5V2U2epmjvkZmB51zTJBbhj4cU"  # USDC vault
alt = "24MSaP3phDW5gGiCP78SM5n9i8cvKYTotXBqCm7ZGuYb"
