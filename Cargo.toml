[workspace]
resolver = "2"
members = [".", "sim-server"]

[package]
name = "solana-arb-bot"
version = "0.1.0"
edition = "2021"
# Ensures `cargo run` at the workspace root always starts the main bot binary
# even though a second binary (alt_loader) also exists in this package.
default-run = "solana-arb-bot"

[profile.release]
# Maximum runtime performance for the hot path. Compile time goes up
# significantly (LTO + single codegen unit), but every microsecond saved
# in tx build / ALT walk / Jito broadcast is worth it on a long-running
# arbitrage bot.
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[dependencies]
# Solana
solana-sdk = "2.2"
solana-client = "2.2"
solana-transaction-status = "2.2"
spl-associated-token-account = "6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
bincode = "1"
bs58 = "0.5"

# Async / HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

# gRPC (Jito)
tonic = { version = "0.12", features = ["tls", "tls-webpki-roots"] }
prost = "0.13"
prost-types = "0.13"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
futures = "0.3"
rand = "0.8"
anyhow = "1"
thiserror = "1"
core_affinity = "0.8"
tokio-stream = "0.1"


[build-dependencies]
tonic-build = "0.12"
